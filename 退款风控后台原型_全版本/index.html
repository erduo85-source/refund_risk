<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:," />
    <meta
      name="description"
      content="游戏维度的 Apple App Store 与 Google Play 退款风险控制后台原型"
    />
    <title>退款风控中心 · 版本4</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#mainContent">跳到主要内容</a>

    <div class="app-shell">
      <aside class="sidebar" id="sidebar" aria-label="主导航">
        <nav class="nav-list" id="mainNav">
          <button class="nav-section-toggle nav-payment-link" data-nav-section="payment" type="button">
            <img class="nav-icon-image" src="assets/nav-payment-risk.svg" alt="" />
            <span class="nav-section-label">支付风控</span>
            <span class="nav-caret" aria-hidden="true"><img src="assets/nav-chevron-right.svg" alt="" /></span>
          </button>

          <div class="nav-group">
            <button class="nav-section-toggle nav-refund-toggle" data-nav-toggle="refund" type="button" aria-expanded="true" aria-controls="refundNavSublist">
              <img class="nav-icon-image" src="assets/nav-refund-risk.svg" alt="" />
              <span class="nav-section-label">退款风控</span>
              <span class="nav-caret" aria-hidden="true"><img src="assets/nav-chevron-up.svg" alt="" /></span>
            </button>
            <div class="nav-sublist" id="refundNavSublist">
              <button class="nav-item nav-subitem active" data-page="users" type="button">
                <span class="nav-subitem-spacer" aria-hidden="true"></span>
                <span>受控用户</span>
              </button>
              <button class="nav-item nav-subitem" data-page="refunds" type="button">
                <span class="nav-subitem-spacer" aria-hidden="true"></span>
                <span>退款记录</span>
              </button>
              <button class="nav-item nav-subitem" data-page="config" type="button">
                <span class="nav-subitem-spacer" aria-hidden="true"></span>
                <span>退款策略</span>
              </button>
            </div>
          </div>

          <button class="nav-item nav-root-item" data-page="audit" type="button">
            <img class="nav-icon-image" src="assets/nav-audit.svg" alt="" />
            <span>操作日志</span>
          </button>
        </nav>

        <div class="sidebar-foot">
          <div class="service-state">
            <span class="status-dot"></span>
            <div>
              <strong>拦截服务正常</strong>
              <small>上次同步 1 分钟前</small>
            </div>
          </div>
          <button class="help-link" type="button" id="helpBtn">
            <span data-icon="help"></span>
            使用帮助
          </button>
        </div>
      </aside>

      <div class="workspace">
        <header class="topbar platform-topbar">
          <button
            class="icon-button mobile-menu"
            id="mobileMenuBtn"
            type="button"
            aria-label="打开导航"
            aria-controls="sidebar"
            aria-expanded="false"
          >
            <span data-icon="menu"></span>
          </button>

          <div class="platform-brand" aria-label="平台服务中心">
            <span class="platform-logo" aria-hidden="true">
              <svg viewBox="0 0 40 40" fill="none">
                <path d="M25.5 5.5c-7.9 1.4-13 7.9-12.1 15.2.8 6.5 6.4 11.1 13.2 10.8" />
                <path d="M14.3 12.2 6.8 17.7l7.8 4.7M24.4 10.7l-7.1 9.4 9.4 12.2M22.5 19.2l9.9-5.9" />
              </svg>
            </span>
            <strong>平台服务中心</strong>
          </div>

          <nav class="global-nav" aria-label="平台一级导航">
            <button type="button" data-global-nav="console">游戏控制台</button>
            <button class="active" type="button" data-global-nav="risk" aria-current="page">
              支付风控<span data-icon="chevron-down"></span>
            </button>
            <button type="button" data-global-nav="project">项目管理</button>
          </nav>

          <span class="visually-hidden" id="breadcrumbTitle">受控用户</span>

          <div class="top-actions platform-actions">
            <label class="project-select-wrap platform-project-select" for="projectSelect">
              <span class="project-badge platform-project-badge" id="projectBadge">N</span>
              <span class="project-label">
                <select id="projectSelect" aria-label="选择游戏项目">
                  <option value="nebula">星界远征 · 国服</option>
                  <option value="dragon">龙域传说 · 亚太服</option>
                  <option value="tactics">像素战纪 · 全球服</option>
                </select>
              </span>
              <span class="select-chevron" data-icon="chevron-down"></span>
            </label>

            <span class="platform-divider" aria-hidden="true"></span>

            <button class="icon-button platform-tool-button" type="button" data-platform-action="docs" aria-label="文档中心">
              <span data-icon="document"></span>
            </button>
            <button class="icon-button platform-tool-button" type="button" data-platform-action="downloads" aria-label="下载中心">
              <span data-icon="download"></span>
            </button>
            <button class="icon-button platform-tool-button notification-button" type="button" data-platform-action="notifications" aria-label="通知中心，有新通知">
              <span data-icon="bell"></span>
              <span class="notification-dot"></span>
            </button>

            <button class="platform-account" type="button" data-platform-action="account" aria-label="打开张晓齐的账号菜单">
              <span class="platform-user-avatar"><span data-icon="users"></span></span>
              <span class="account-name">张晓齐</span>
              <span class="account-chevron" data-icon="chevron-down"></span>
            </button>
          </div>
        </header>

        <main class="main-content" id="mainContent" tabindex="-1">
          <section class="page" id="page-overview" aria-labelledby="overviewTitle"></section>
          <section class="page active" id="page-users" aria-labelledby="usersTitle"></section>
          <section class="page" id="page-refunds" aria-labelledby="refundsTitle"></section>
          <section class="page" id="page-config" aria-labelledby="configTitle"></section>
          <section class="page" id="page-audit" aria-labelledby="auditTitle"></section>
        </main>
      </div>
    </div>

    <div class="mobile-scrim" id="mobileScrim"></div>
    <div class="drawer-scrim" id="drawerScrim"></div>

    <aside
      class="detail-drawer"
      id="detailDrawer"
      role="dialog"
      aria-modal="true"
      aria-labelledby="drawerTitle"
      aria-hidden="true"
    >
      <div id="drawerContent"></div>
    </aside>

    <div class="modal-layer" id="modalLayer" aria-hidden="true">
      <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
        <button class="modal-close icon-button" id="modalClose" type="button" aria-label="关闭">
          <span data-icon="close"></span>
        </button>
        <div class="modal-icon" id="modalIcon"></div>
        <h2 id="modalTitle"></h2>
        <p id="modalDescription"></p>
        <div class="modal-context" id="modalContext"></div>
        <label class="form-label" for="modalReason">操作备注 <span>选填</span></label>
        <textarea
          id="modalReason"
          class="textarea"
          rows="3"
          maxlength="120"
          placeholder="请输入操作原因，便于后续审计"
        ></textarea>
        <div class="modal-actions">
          <button class="button secondary" id="modalCancel" type="button">取消</button>
          <button class="button danger" id="modalConfirm" type="button">确认</button>
        </div>
      </div>
    </div>

    <div class="toast-region" id="toastRegion" aria-live="polite" aria-atomic="true"></div>

    <script src="./app.js"></script>
  </body>
</html>
